services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
      - TRAEFIK_MODE=${TRAEFIK_MODE:-prod}
      - TRAEFIK_API_INSECURE=${TRAEFIK_API_INSECURE:-false}
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL:-INFO}
      - TRAEFIK_INSECURE_SKIP_VERIFY=${TRAEFIK_INSECURE_SKIP_VERIFY:-false}
      - TRAEFIK_DASHBOARD_HOST=${TRAEFIK_DASHBOARD_HOST:-127.0.0.1}
      - TRAEFIK_DASHBOARD_PORT=${TRAEFIK_DASHBOARD_PORT:-8080}
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_HOST:-127.0.0.1}:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=le"
      - "--entrypoints.websecure.http.tls.options=default@file"
      - "--providers.file.directory=/tls"
      - "--providers.file.watch=true"
      - "--entrypoints.traefik.address=:8080"
      - "--serversTransport.insecureSkipVerify=${TRAEFIK_INSECURE_SKIP_VERIFY:-false}"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-benoit@bentoweb.fr}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--api.dashboard=true"
      - "--api.insecure=${TRAEFIK_API_INSECURE:-false}"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./tls.yaml:/tls/tls.yaml:ro
      - ./404.html:/usr/share/nginx/html/index.html:ro
    networks:
      - proxy

  # template 404 par défaut
  error-page:
    image: nginx:alpine
    container_name: error-page
    restart: unless-stopped
    volumes:
      - ./404.html:/usr/share/nginx/html/404.html:ro
      - ./404.html:/usr/share/nginx/html/index.html:ro
      - ./nginx-error.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.error-page.rule=HostRegexp(`^.+$`)"
      - "traefik.http.routers.error-page.priority=1"
      - "traefik.http.routers.error-page.entrypoints=websecure"
      - "traefik.http.routers.error-page.tls=true"
      - "traefik.http.services.error-page.loadbalancer.server.port=80"
      - "traefik.http.routers.placeholder-3go.rule=Host(`3go.app`)"
      - "traefik.http.routers.placeholder-3go.entrypoints=websecure"
      - "traefik.http.routers.placeholder-3go.priority=10"
      - "traefik.http.routers.placeholder-3go.service=error-page"

networks:
  proxy:
    external: true
